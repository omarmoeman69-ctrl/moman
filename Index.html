<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التواصل مع المهندس مؤمن أحمد</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000000;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* شاشة الألعاب النارية */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .card {
            background: rgba(15, 15, 15, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 350px;
            width: 90%;
            z-index: 10; /* لجعل البطاقة فوق الألعاب النارية وتكون واضحة */
        }

        h1 {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 26px;
        }

        .phone {
            font-size: 22px;
            font-weight: bold;
            color: #00ffcc;
            margin: 15px 0;
            display: block;
            text-decoration: none;
            direction: ltr;
        }

        .phone:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* تنسيق زر الواتساب */
        .whatsapp-btn {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 12px 20px;
            margin-top: 15px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }

        p {
            color: #cccccc;
            font-size: 15px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- عنصر الرسم الخاص بالألعاب النارية المتحركة -->
    <canvas id="fireworksCanvas"></canvas>

    <div class="card">
        <h1>المهندس مؤمن أحمد</h1>
        
        <!-- رابط الاتصال المباشر برقم الهاتف -->
        <a href="tel:+201028663349" class="phone">+20 102 866 3349</a>
        
        <p>التواصل يرجى الاتصال أو المراسلة</p>

        <!-- زر الواتساب -->
        <a href="https://wa.me/qr/XWNROXWY4772D1?s=v" target="_blank" class="whatsapp-btn">
            راسلني عبر واتساب 💬
        </a>
    </div>

    <script>
        // كود برمجي لجعل الألعاب النارية تفرقع بشكل متحرك في الخلفية
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height / 2);
                this.speed = 5;
                this.angle = Math.atan2(this.targetY - this.y, 0);
                this.particles = [];
                this.exploded = false;
                this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            }

            update() {
                if (!this.exploded) {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.exploded = true;
                        this.createParticles();
                    }
                } else {
                    this.particles.forEach(p => p.update());
                    this.particles = this.particles.filter(p => p.alpha > 0);
                }
            }

            createParticles() {
                const count = 50;
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(this.x, this.y, this.color));
                }
            }

            draw() {
                if (!this.exploded) {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x, this.y, 3, 3);
                } else {
                    this.particles.forEach(p => p.draw());
                }
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.010;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.05; // الجاذبية
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let fireworks = [];

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.05) {
                fireworks.push(new Firework());
            }

            fireworks.forEach((fw, index) => {
                fw.update();
                fw.draw();
                if (fw.exploded && fw.particles.length === 0) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
  </html>
